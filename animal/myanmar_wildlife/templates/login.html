{% extends "base.html" %}
{% block title %}အကောင့်ဝင်ရန် - Myanmar Wildlife{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
            </div>
            <h1>အကောင့်ဝင်ရန်</h1>
            <p>တိရစ္ဆာန်အားလုံးနှင့် AI ပြောဆိုခန်းကို ဆက်လက်အသုံးပြုရန်</p>
        </div>
        <form method="POST" class="auth-form">
            {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
            <div class="form-group">
                <label for="email">အီးမေးလ်</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="password">စကားဝှက်</label>
                <input type="password" id="password" name="password" required placeholder="စကားဝှက်ထည့်ပါ">
            </div>
            <button type="submit" class="btn btn-auth">ဝင်ရန်</button>
        </form>
        <div class="auth-footer">
            အကောင့် မရှိသေးပါလား?
            <a href="{{ url_for('register') }}">စာရင်းသွင်းရန်</a>
        </div>
    </div>
</div>
{% endblock %}
